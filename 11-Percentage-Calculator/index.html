    <!-- Structured Data: FAQPage JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I calculate what percentage one number is of another?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Divide the part by the whole and multiply by 100. For example, 45 out of 180 is (45 ÷ 180) × 100 = 25%. The “X is what percent of Y?” card does this instantly as you type."
          }
        },
        {
          "@type": "Question",
          "name": "How do I find X% of a number?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Divide the percentage by 100 to turn it into a decimal, then multiply by the number. For example, 15% of 200 is 0.15 × 200 = 30. A quick mental shortcut is to find 10% by moving the decimal point one place to the left and then scale from there."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between percentage change and percentage difference?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Percentage change compares a new value against a specific starting point, so direction matters and the result can be an increase or a decrease. Percentage difference measures how far apart two values are relative to their average and is always a positive number, which makes it suitable when neither value is the obvious starting point."
          }
        },
        {
          "@type": "Question",
          "name": "Why does a 10% increase followed by a 10% decrease not bring me back to the original number?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Because the second percentage is applied to a different base. 100 increased by 10% is 110, and 10% of 110 is 11, so decreasing it gives 99. Successive percentage changes multiply rather than add, so the net effect here is a 1% loss."
          }
        },
        {
          "@type": "Question",
          "name": "How does the reverse percentage calculator work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "If you know that a part is a certain percentage of an unknown whole, the whole is (part × 100) ÷ percentage. For example, if 30 represents 25% of a total, the total is (30 × 100) ÷ 25 = 120."
          }
        },
        {
          "@type": "Question",
          "name": "How is tax added to and removed from a price?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "To add tax, multiply the amount by the rate divided by 100 and add it on: 1,000 at 18% becomes 1,180. To remove tax from a tax-inclusive price, multiply by 100 and divide by (100 + rate): 1,000 including 18% tax has a base of about 847.46. Simply subtracting 18% from the inclusive price would give the wrong answer."
          }
        },
        {
          "@type": "Question",
          "name": "Are two discounts of 20% and 10% the same as a 30% discount?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Stacked discounts apply one after the other, so 20% off and then 10% off leaves you paying 0.8 × 0.9 = 72% of the original price, which is a total discount of 28%, not 30%. You can check this by running the discount card twice."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between a percent and a percentage point?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A percentage point is the plain arithmetic difference between two percentages, while a percent change is relative. If an interest rate moves from 4% to 5%, it rose by 1 percentage point, but that is a 25% increase relative to the original 4%."
          }
        },
        {
          "@type": "Question",
          "name": "Why do some cards show a dash instead of a result?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A dash appears when the calculation is undefined, because it would require dividing by zero, for example asking what percent a number is of 0, or measuring percentage change from a starting value of 0. Fill in a non-zero value and the result will appear."
          }
        },
        {
          "@type": "Question",
          "name": "Are my numbers sent anywhere?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Every calculation runs entirely in your browser with JavaScript. Nothing you type is uploaded, logged or shared, and the tool keeps working without a connection once the page has loaded."
          }
        }
      ]
    }
    </script>
