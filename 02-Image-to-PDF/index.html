    <!-- Structured Data: FAQPage JSON-LD (must match FAQ text in src/components/SEO.tsx) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I convert images to a PDF?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Drop your JPG, PNG or WebP files onto the upload area, or click it to choose files. Arrange the pages, pick a page size, orientation, image fitting, margin, background colour and output quality, then click Convert to PDF. When the document is ready you can preview it and download it with one click."
          }
        },
        {
          "@type": "Question",
          "name": "Can I combine multiple images into one PDF?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Select as many images as you like and each one becomes its own page in a single PDF. You can drag thumbnails to reorder them, use the Move Up and Move Down buttons, or sort the whole set by file name (A to Z or Z to A). You can also add more images to the set at any time before converting."
          }
        },
        {
          "@type": "Question",
          "name": "Which image formats are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "JPG, JPEG, PNG and WebP. Other formats such as HEIC (the default on many iPhones), GIF, BMP, TIFF and SVG are not accepted, so convert them to JPG or PNG first. WebP images are converted to JPEG during processing because the PDF format cannot store WebP directly."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a file size or image count limit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Each image can be up to 100 MB. There is no fixed limit on how many images you can add, but everything is processed in your browser, so a very large batch of high-resolution photos can be slow or run out of memory on older phones and laptops. If that happens, convert the images in smaller groups."
          }
        },
        {
          "@type": "Question",
          "name": "Are my images uploaded to a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Your images are read, processed and assembled into a PDF entirely inside your browser using JavaScript. They are not sent to MicroFree or any other server, and nothing is kept after you close or reload the page."
          }
        },
        {
          "@type": "Question",
          "name": "Will converting reduce the quality of my images?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on the Output Quality setting. High (about 92%), Balanced (about 80%) and Small File (about 60%) re-encode every image as a JPEG, which reduces file size and can soften fine detail at lower settings. Original keeps unrotated JPG and PNG files exactly as they are; rotated images and WebP files still have to be redrawn, and are saved at very high quality."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between Fit to Page, Fill Page and Original Size?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fit to Page scales the image so the whole picture fits inside the margins, which may leave empty space around it. Fill Page scales the image until the page is fully covered, so parts of the picture that extend past the page edge are cropped. Original Size draws one image pixel as one PDF point (1/72 of an inch) and only shrinks the image if it is too big for the page."
          }
        },
        {
          "@type": "Question",
          "name": "Can I change the page orientation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Choose Portrait, Landscape or Auto. Auto picks the orientation for each page separately, so wide images get landscape pages and tall images get portrait pages within the same PDF. When the page size is set to Original, each page simply takes the shape of its image, so the orientation option is not used."
          }
        },
        {
          "@type": "Question",
          "name": "Will the text in my scanned images be searchable in the PDF?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The tool places each image on a page as a picture and does not perform OCR (optical character recognition). The PDF will look like your images, but you cannot search or select the text in it unless you run it through a separate OCR tool afterwards."
          }
        },
        {
          "@type": "Question",
          "name": "Is the converter free, and does it work on phones?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, it is free to use with no account and no watermark added to your PDF. It runs in modern browsers on Windows, macOS, Linux, Android and iOS. On touchscreens, where dragging thumbnails can be unreliable, use the Move Up and Move Down buttons to change the page order."
          }
        }
      ]
    }
    </script>
