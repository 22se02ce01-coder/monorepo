name: Deploy to Cloudflare Pages

# Every push to main builds all 21 sites and uploads each one to its own
# Cloudflare Pages project (microfree.store + 20 tool subdomains).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADSENSE_PUB_ID: ${{ secrets.ADSENSE_PUB_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build all sites
        run: bash build-deploy.sh

      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set yet - built but not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload each site to Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for project in $(python3 scripts/cloudflare_pages.py projects); do
            echo "::group::$project"
            # creates the project the first time; ignored if it already exists
            npx --yes wrangler@3 pages project create "$project" --production-branch main >/dev/null 2>&1 || true
            npx --yes wrangler@3 pages deploy "deploy/$project" --project-name "$project" --branch main --commit-dirty=true
            echo "::endgroup::"
          done

      - name: Connect custom domains (microfree.store + subdomains)
        if: steps.secrets.outputs.ready == 'true'
        run: python3 scripts/cloudflare_pages.py domains
