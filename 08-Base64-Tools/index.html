    <!-- Structured Data: FAQPage JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Base64 encoding used for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Base64 represents binary data using 64 printable characters so it can travel through systems designed for text. It is commonly used to embed images in HTML or CSS as data URIs, carry binary data inside JSON or XML, encode email attachments and build HTTP Basic authentication headers."
          }
        },
        {
          "@type": "Question",
          "name": "Is Base64 a form of encryption?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Base64 is an encoding, not encryption. Anyone can decode it without a key, so it must never be used on its own to protect passwords, tokens or other secrets."
          }
        },
        {
          "@type": "Question",
          "name": "Why is Base64 output larger than the input?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every 3 bytes of input become 4 characters of output, so encoded data is roughly 33 percent larger than the original, plus up to two padding characters."
          }
        },
        {
          "@type": "Question",
          "name": "Does this tool handle emoji and non-English text correctly?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Text is converted to UTF-8 bytes with the browser TextEncoder before encoding and decoded back with TextDecoder, so emoji, accented letters and scripts such as Arabic, Hindi and Chinese round-trip correctly."
          }
        },
        {
          "@type": "Question",
          "name": "What is URL-safe Base64?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Standard Base64 uses the + and / characters and = padding, which have special meanings in URLs. URL-safe Base64 replaces + with -, / with _ and removes the padding. Tick the URL-safe option when encoding text to produce this variant."
          }
        },
        {
          "@type": "Question",
          "name": "Can I decode URL-safe Base64 or strings without padding?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The decoder converts - and _ back to + and /, removes spaces and line breaks, and adds any missing = padding before decoding."
          }
        },
        {
          "@type": "Question",
          "name": "How do I convert an image to a Base64 data URI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Open the Image to Base64 tab and choose or drop an image file. The tool produces a full data URI that you can paste into an img src attribute or a CSS url() value. Tick the raw option if you only need the Base64 part without the data: prefix."
          }
        },
        {
          "@type": "Question",
          "name": "Why does my decoded text contain strange characters?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The decoder interprets the bytes as UTF-8 text. If the original data was binary, such as an image or compressed file, or text in a different character encoding, it cannot be displayed correctly and invalid sequences appear as replacement characters."
          }
        },
        {
          "@type": "Question",
          "name": "Are my files or text sent to a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. All encoding and decoding happens entirely in your browser using native JavaScript APIs. Your text, images and tokens are never uploaded, logged or stored."
          }
        }
      ]
    }
    </script>
