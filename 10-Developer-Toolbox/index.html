    <!-- Structured Data: WebApplication JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "MicroFree Developer Toolbox",
      "url": "https://microfree.store/developer-toolbox/",
      "description": "An all-in-one collection of browser-based developer utilities: URL encoder/decoder, HTML/CSS/JS formatter and minifier, XML formatter, HTML entity codec, UUID generator, Unix timestamp converter, regex tester, color code converter, and a safe markdown previewer.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "All (Modern Web Browser)",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "browserRequirements": "Requires JavaScript",
      "featureList": [
        "URL encoder and decoder",
        "HTML formatter and minifier",
        "CSS formatter and minifier",
        "JavaScript formatter and conservative minifier",
        "XML formatter",
        "HTML entity encoder and decoder",
        "UUID v4 generator (Web Crypto)",
        "Unix timestamp converter",
        "Regular expression tester",
        "HEX / RGB / HSL color converter",
        "Safe markdown previewer",
        "100% in-browser client-side processing"
      ]
    }
    </script>
    <!-- Structured Data: FAQPage JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is my code or data sent to a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Every utility in the Developer Toolbox runs entirely in your browser using native JavaScript APIs. Your snippets and text never leave your device."
          }
        },
        {
          "@type": "Question",
          "name": "How good is the JavaScript minifier?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is a conservative minifier: it strips comments and collapses whitespace while preserving strings, template literals and regular expressions. It is useful for quick size reduction, but it does not rename variables or remove unused code like a full optimising tool such as Terser or esbuild."
          }
        },
        {
          "@type": "Question",
          "name": "Is the Markdown previewer safe from XSS?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. All input is HTML-escaped first and only a small, known set of tags is generated. Links are only created for http and https addresses. Raw HTML, scripts, iframes and event handlers in your Markdown are shown as text and never executed."
          }
        },
        {
          "@type": "Question",
          "name": "Are the generated UUIDs truly random?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The UUID generator uses crypto.getRandomValues, the browser cryptographically secure random source, to produce RFC 4122 version 4 identifiers. You can generate between 1 and 100 at a time."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between URL encoding and HTML entity encoding?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "URL encoding replaces unsafe characters with percent codes such as %20 so text can be placed inside a URL. HTML entity encoding replaces characters such as \u003c and & with entities such as &lt; and &amp; so text can be displayed safely inside HTML. They solve different problems and are not interchangeable."
          }
        },
        {
          "@type": "Question",
          "name": "Why does my converted timestamp show a date in 1970 or far in the future?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The value is probably in the wrong unit. A Unix timestamp in seconds read as milliseconds lands near 1970, and a millisecond value read as seconds lands thousands of years ahead. Switch between seconds and milliseconds in the converter."
          }
        },
        {
          "@type": "Question",
          "name": "Which regular expression syntax does the regex tester use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It uses the JavaScript RegExp engine built into your browser, with the g, i, m, s and u flags available. Most common syntax is shared with other languages, but some features differ from PCRE, Python or Java, so test in your target language as well."
          }
        },
        {
          "@type": "Question",
          "name": "Which colour formats can the colour converter handle?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It converts between HEX, RGB and HSL. Changing any one of them updates the others and the live colour swatch."
          }
        },
        {
          "@type": "Question",
          "name": "Does the XML formatter validate my XML?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. It re-indents elements to make the structure readable but does not check the document for well-formedness or validate it against a schema or DTD."
          }
        }
      ]
    }
    </script>
