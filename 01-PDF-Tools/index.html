    <!-- Structured Data: WebApplication JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      },

      "featureList": [
        "Merge multiple PDF documents",
        "Split PDF by page ranges",
        "Browser-side PDF stream optimization and compression",
        "Rotate individual or all pages",
        "Delete unwanted PDF pages",
        "Extract specific pages to a new PDF",
        "Reorder PDF pages visually",

    <!-- Structured Data: FAQPage JSON-LD (mirrors FAQ in src/components/SEO.tsx) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Are my PDF files uploaded to a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Every operation runs in JavaScript inside your browser tab using the open-source pdf-lib library. The file is read from your device into memory, processed there, and the result is offered back to you as a download. Nothing is sent to MicroFree or any third party, and closing the tab discards the data."
          }
        },
        {
          "@type": "Question",
          "name": "How does the Compress PDF option reduce file size?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It reloads the document and saves it again with compressed object streams, which packs the small internal objects (page dictionaries, font descriptors, cross-reference data) more efficiently. It does not downsample or recompress images, so text and graphics stay exactly as sharp as before. The trade-off is that savings are usually modest, and image-heavy or scanned PDFs may barely shrink at all."
          }
        },
        {
          "@type": "Question",
          "name": "Why did my compressed PDF not get any smaller?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most of the size in a typical PDF comes from embedded images and fonts, which this optimizer leaves untouched. If the original was already saved with object streams by a modern application, there is little left to gain, and the tool will report a 0% reduction. In that case keep your original file."
          }
        },
        {
          "@type": "Question",
          "name": "In what order are files merged?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Files are joined in the order they appear in the selected files list, which is the order you picked them. To change the order, remove the files and add them again in the sequence you want. Every page of every file is copied, so you can then use Delete Pages or Reorder Pages on the merged result if needed."
          }
        },
        {
          "@type": "Question",
          "name": "How do I write page numbers for Split, Extract, Delete and Reorder?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Use commas between pages and a dash for ranges, for example 1-3, 5, 8-10. Split creates one PDF per group you type (1-3, 5 and 8-10 above become three files, downloaded together as a ZIP); leaving Split blank makes one file per page. Extract and Delete use the same format, and Reorder accepts ranges too, so 5-1 reverses a five-page file. Page numbers always count from 1, regardless of any numbering printed on the pages."
          }
        },
        {
          "@type": "Question",
          "name": "Can I remove or add a password with this tool?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. These tools do not add or remove PDF passwords, and a password-protected file will show an error when you open it. To remove a password you know, open the file in a desktop PDF reader and save or print it to a new unprotected PDF, then use that copy here."
          }
        },
        {
          "@type": "Question",
          "name": "Will bookmarks, links and form fields survive merging or splitting?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Page content, text and images are copied faithfully. However, Merge, Split, Extract, Delete and Reorder build a brand-new document from the copied pages, so document-level features such as the bookmark outline, interactive form fields and internal links that point to other pages may not carry over. Check the result if those features matter to you."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use any language or symbol in a watermark?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Watermarks and page numbers use the standard Helvetica font built into every PDF reader, which covers Latin characters such as English and most Western European languages. Characters outside that set, such as Chinese, Arabic, Cyrillic or emoji, cannot be drawn and the tool will report an error."
          }
        },
        {
          "@type": "Question",
          "name": "Is a watermark a reliable way to protect a document?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A watermark is a visible label, not a security control. It is drawn as text on top of each page and a determined person with PDF editing software can remove it. It is useful for marking drafts or showing who a copy was intended for, but it does not prevent copying, printing or editing."
          }
        },
        {
          "@type": "Question",
          "name": "What is the largest PDF I can process?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "There is no fixed limit in the tool. Because the whole file is held in your device memory while it is processed, the practical limit depends on your browser and hardware. Files of tens of megabytes are generally fine on a laptop; very large files or long merges on a phone may be slow or cause the tab to run out of memory."
          }
        }
      ]
    }
    </script>
