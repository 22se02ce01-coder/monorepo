    <!-- Structured Data: WebApplication JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "MicroFree Image Converter",

      "description": "Convert images seamlessly between JPG, PNG, and WebP formats with transparency background controls, batch processing, and zero server uploads.",

      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "browserRequirements": "Requires JavaScript and HTML5 Canvas support",
      "featureList": [
        "JPG to PNG converter",
        "PNG to JPG with transparent background fill",
        "JPG to WebP for modern web performance",
        "PNG to WebP with alpha transparency preservation",
        "WebP to JPG and PNG",
        "Batch image conversion",
        "100% private in-browser client-side processing"
      ]

    </script>
    <!-- Structured Data: FAQPage JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does PNG to JPG conversion handle transparent backgrounds?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "JPG files do not support transparency. Before your image is drawn, the converter paints the canvas with a solid background colour, white by default, so transparent areas become that colour instead of turning black. When JPG is selected you can pick any background colour with the colour picker."
          }
        },
        {
          "@type": "Question",
          "name": "Why should I convert images to WebP?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "WebP is a modern web format that supports both lossy compression and transparency. Google reports that lossy WebP files are typically around 25 to 34 percent smaller than comparable JPGs, which helps web pages load faster. All current major browsers can display WebP, but some older software cannot open it."
          }
        },
        {
          "@type": "Question",
          "name": "Are my images uploaded to a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The entire conversion runs inside your web browser using the HTML5 canvas. Your images are never uploaded, stored or shared, and they are discarded when you close or reset the page."
          }
        },
        {
          "@type": "Question",
          "name": "Can I convert multiple photos at once?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can select or drop several images and convert them all to the chosen format in one click. Each converted file then has its own Download button; your browser may ask for permission to download multiple files."
          }
        },
        {
          "@type": "Question",
          "name": "What does the quality slider do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The quality slider, from 20 to 100 percent with a default of 92, controls how strongly JPG and WebP output is compressed. Lower values give smaller files with more visible compression artefacts. It is hidden for PNG because PNG is always lossless."
          }
        },
        {
          "@type": "Question",
          "name": "Will converting a JPG to PNG improve its quality?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. PNG stores pixels exactly, but it cannot recover detail that JPG compression has already removed. The PNG will look the same as the source JPG and will usually be a larger file."
          }
        },
        {
          "@type": "Question",
          "name": "Does the converter resize or crop my images?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Converted images keep the same pixel width and height as the originals. The tool changes only the file format and, for JPG and WebP, the compression level."
          }
        },
        {
          "@type": "Question",
          "name": "Is EXIF metadata such as camera details or GPS location kept?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Because each image is redrawn on a canvas and re-encoded, metadata such as EXIF camera information and GPS coordinates is not copied to the converted file."
          }
        },
        {
          "@type": "Question",
          "name": "Why is my converted file bigger than the original?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "This usually happens when a photo is converted to PNG, which is lossless, or when an already compressed JPG is re-saved at a high quality setting. Try JPG or WebP with a lower quality value, or keep the original if it is already smaller."
          }
        }
      ]
    }
    </script>
