    <!-- Structured Data: WebApplication JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "MicroFree Image Resizer",
      "url": "https://microfree.store/image-resizer/",
      "description": "Resize photos and graphics by exact pixel dimensions, percentage scaling, or social media templates with aspect ratio constraints and zero server uploads.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "All (Modern Web Browser)",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "browserRequirements": "Requires JavaScript and HTML5 Canvas support",
      "featureList": [
        "Exact custom width and height inputs",
        "Aspect ratio lock and unlock",
        "Percentage scaling (25%, 50%, 75%, 150%, 200%)",
        "Social media presets for Instagram, YouTube, and Web",
        "JPG, PNG, and WebP format export",
        "Before and after preview",
        "100% in-browser client-side privacy"
      ]
    }
    </script>
    <!-- Structured Data: FAQPage JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does the aspect ratio lock work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "In the By Pixels mode the lock is on by default. While it is on, typing a new width automatically recalculates the height (and vice versa) using the proportions of your original image, so the picture is never stretched. Turn the lock off if you need a width and height that do not match the original shape."
          }
        },
        {
          "@type": "Question",
          "name": "What do the Contain, Crop, and Stretch fit modes do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "They decide what happens when the target size has a different shape from your photo. Contain fits the whole image inside the frame and fills the leftover space with white (JPG) or transparency (PNG and WebP). Crop fills the entire frame and trims the edges that overflow, keeping the image centered. Stretch forces the image to the exact width and height, which distorts it if the proportions differ. Contain is the default."
          }
        },
        {
          "@type": "Question",
          "name": "Will resizing reduce the sharpness of my photo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Making an image smaller usually keeps it looking crisp, because the browser combines several source pixels into each new pixel using its high-quality smoothing setting. Making an image larger cannot add detail that was never captured, so enlarging well beyond the original size will look soft or blurry. For the best results, start from the largest original you have and scale down."
          }
        },
        {
          "@type": "Question",
          "name": "Are my photos uploaded to a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The image is decoded, redrawn, and encoded entirely inside your browser using the HTML5 Canvas API. The file is never sent to MicroFree or any other server, and the resized copy exists only in your browser memory until you download it or close the page."
          }
        },
        {
          "@type": "Question",
          "name": "Which file formats can I upload and download?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can upload JPG, PNG, and WebP images and save the result as JPG, PNG, or WebP, regardless of the original format. That means the tool can also convert between these formats while resizing."
          }
        },
        {
          "@type": "Question",
          "name": "Why did the transparent background of my PNG turn white?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "JPG does not support transparency, so when you export to JPG the tool fills the background with white before drawing your image. Choose PNG or WebP as the output format if you need to keep transparent areas."
          }
        },
        {
          "@type": "Question",
          "name": "What does the Quality slider change?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The slider (20% to 100%, default 90%) controls compression for JPG and WebP output. Lower values produce smaller files with more visible compression artifacts. PNG is a lossless format, so the browser ignores the quality setting when you export to PNG."
          }
        },
        {
          "@type": "Question",
          "name": "Can I resize several images at once?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not at the moment. The tool works on one image at a time. After downloading a result, click Change Image to load the next file. Your chosen format and quality settings stay in place, so repeating the process is quick."
          }
        },
        {
          "@type": "Question",
          "name": "Does resizing keep the photo metadata (EXIF)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Because the image is redrawn on a canvas and saved as a new file, camera metadata such as the capture date, camera model, and GPS location is not copied into the resized image. This is often useful for privacy before sharing a photo online."
          }
        },
        {
          "@type": "Question",
          "name": "What are the recommended dimensions for Instagram posts?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The built-in presets use 1080 x 1080 pixels for square posts (1:1), 1080 x 1350 for portrait posts (4:5), and 1080 x 1920 for Stories and Reels (9:16). Platforms change their guidelines from time to time, so it is worth checking the current recommendations if exact sizing matters."
          }
        }
      ]
    }
    </script>
