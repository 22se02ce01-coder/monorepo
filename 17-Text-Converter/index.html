    <!-- Structured Data: WebApplication JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "MicroFree Text Case Converter",

        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "browserRequirements": "Requires JavaScript",
      "featureList": [
        "UPPERCASE, lowercase, Title Case and Sentence case conversion",
        "camelCase, snake_case and kebab-case formatting",
        "Live word, character, line, sentence and paragraph counters",
        "Reading-time estimation",

    </script>
    <!-- Structured Data: FAQPage JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is the difference between Title Case and Capitalize Words?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Capitalize Words uppercases the first letter of every word and leaves the remaining letters unchanged. Title Case follows headline style: it lowercases each word, capitalizes its first letter, and keeps short words such as a, an, the, and, of, to, in and for lowercase unless they begin the text."
          }
        },
        {
          "@type": "Question",
          "name": "Why did my acronyms become lowercase?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Title Case and Sentence case lowercase every word before capitalizing, so NASA becomes Nasa and proper nouns inside a sentence lose their capitals. Fix those words by hand afterwards, or use Capitalize Words, which never lowercases letters."
          }
        },
        {
          "@type": "Question",
          "name": "What are camelCase, snake_case and kebab-case used for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "They are naming conventions for code and URLs. camelCase (myVariableName) is common for JavaScript variables, snake_case (my_variable_name) for Python and database columns, and kebab-case (my-variable-name) for URL slugs, CSS classes and file names. The converter splits on spaces, punctuation and existing camel-case boundaries, then joins the words in the chosen style."
          }
        },
        {
          "@type": "Question",
          "name": "How is reading time calculated?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It divides the word count by an average silent-reading speed of 200 words per minute and shows the result in minutes and seconds. It is an estimate; technical or unfamiliar text takes longer to read."
          }
        },
        {
          "@type": "Question",
          "name": "How are words, sentences and paragraphs counted?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Words are runs of characters separated by spaces, tabs or line breaks. Sentences are counted by ending punctuation (full stops, question marks and exclamation marks), so abbreviations such as e.g. can inflate the count. Paragraphs are blocks of text separated by at least one blank line."
          }
        },
        {
          "@type": "Question",
          "name": "What exactly does Remove Extra Spaces do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It collapses runs of spaces and tabs into a single space, trims spaces from the start and end of every line, and reduces three or more consecutive line breaks to a single blank line. Single line breaks are kept."
          }
        },
        {
          "@type": "Question",
          "name": "Is Remove Duplicate Lines case-sensitive?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Lines are removed only when they match an earlier line exactly, including capitalization and spacing. The first occurrence is kept in its original position. Run Remove Extra Spaces first if lines differ only by stray spaces."
          }
        },
        {
          "@type": "Question",
          "name": "Why does Sort Lines put 10 before 2?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Lines are sorted alphabetically as text, so they are compared character by character. Pad numbers with leading zeros (02, 10) if you need numeric order."
          }
        },
        {
          "@type": "Question",
          "name": "Can I undo a transformation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "There is no undo button, because each action rewrites the editor in place. Before a lossy step such as lowercase or a code-style conversion, copy your original text or download it as a .txt file so you can restore it."
          }
        },
        {
          "@type": "Question",
          "name": "Does this tool send my text anywhere?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Every transformation and count runs locally in JavaScript in your browser tab. Your text is never uploaded, logged or stored, and it is gone when you close or refresh the page."
          }
        }
      ]
    }
    </script>
