    <!-- Structured Data: FAQPage JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Will the generated DOCX file open in Microsoft Word?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The converter writes a standard Office Open XML (.docx) package containing the document body, a basic style sheet, and the required relationship files. It opens in current versions of Microsoft Word and can also be imported into Google Docs, LibreOffice Writer, and other editors that read the .docx format."
          }
        },
        {
          "@type": "Question",
          "name": "Does this converter support scanned PDFs or OCR?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The tool only reads text that is already stored as text inside the PDF. A scanned page or a photographed document is just a picture of words, and this tool has no optical character recognition (OCR) engine. When little or no text is detected, the result screen shows a notice, and the affected pages contain the placeholder [No selectable text found on this page]."
          }
        },
        {
          "@type": "Question",
          "name": "Are images, tables, and formatting kept in the Word file?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. This is a text extraction converter. Images, vector graphics, table borders, columns, fonts, colors, bold and italic styling, links, headers and footers are not carried over. Every detected paragraph becomes a plain paragraph in Calibri 12 pt on a US Letter page with 1-inch margins, and each PDF page starts on a new page in Word."
          }
        },
        {
          "@type": "Question",
          "name": "Why does my converted document contain no text, or only placeholders?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The most common cause is a scanned PDF: the pages are pictures of text with no text layer, and this tool has no OCR. Password-protected PDFs cannot be opened either. Occasionally a PDF is made with fonts that have no character map, so the text cannot be turned back into readable letters. Check the Extracted Text Preview before downloading to see what was found on each page."
          }
        },
        {
          "@type": "Question",
          "name": "Why are some words joined together or split with extra spaces?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PDFs do not store words and sentences the way a word processor does. They store small runs of characters with positions on the page. The extractor works out spaces from the horizontal gap between runs, which is right for almost all documents, but unusual letter spacing or justified text can occasionally join two words or split one. A quick find-and-replace pass in Word usually fixes this."
          }
        },
        {
          "@type": "Question",
          "name": "Does it work with non-English text?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Usually. pdf.js reads the character maps that most PDF creators embed, so accented letters and scripts such as Cyrillic, Greek, Arabic or Hindi normally come through as real text. Results depend on how the PDF was made: some files, especially older Chinese, Japanese or Korean documents that rely on fonts not embedded in the file, may still produce missing or garbled characters, so check the preview."
          }
        },
        {
          "@type": "Question",
          "name": "Are my documents uploaded to a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The PDF is read with the browser File API and parsed by JavaScript running on your own device, and the Word file is assembled in memory and offered as a local download. The document content is not sent to our servers or to any third party for conversion."
          }
        },
        {
          "@type": "Question",
          "name": "Can I convert password-protected PDFs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Generally no. The tool does not ask for or apply a password. If a PDF is encrypted, its text is stored in encrypted form and the extractor will usually produce empty or unreadable output. Remove the protection with software you are authorized to use, then convert the unlocked copy."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a page limit or file size limit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "There is no fixed limit set by the tool. Because everything runs in your browser, the practical limit is your device memory and speed. Large files with hundreds of pages take longer and may slow down older phones. Only one PDF is converted at a time."
          }
        }
      ]
    }
    </script>
