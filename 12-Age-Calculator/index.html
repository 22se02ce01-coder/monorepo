    <!-- Structured Data: FAQPage JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How is the exact age calculated?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The calculator counts full calendar years first, then the remaining whole months, then counts the leftover days from your most recent “month-birthday”. If that day does not exist in a short month (for example the 31st in February), the last day of that month is used, so the result never goes negative. This matches how people naturally state age, for example “36 years, 5 months and 25 days”."
          }
        },
        {
          "@type": "Question",
          "name": "Does the calculator handle leap years correctly?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Day counts use the real length of each calendar month, including 29 days in February of a leap year, so totals such as days lived are accurate across leap-year boundaries."
          }
        },
        {
          "@type": "Question",
          "name": "I was born on 29 February. When is my birthday counted?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "In leap years your birthday falls on 29 February as usual. In common years there is no 29 February, so the next-birthday countdown rolls over to 1 March. Legal conventions for leap-day birthdays vary by country, so check local rules if the exact date matters for paperwork."
          }
        },
        {
          "@type": "Question",
          "name": "Why can I set an “age as of” date?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is useful for planning and paperwork, such as checking how old someone will be on an exam date, an application deadline or a retirement date, or how old they were on a past event. Set any date on or after the date of birth and the age recalculates instantly."
          }
        },
        {
          "@type": "Question",
          "name": "What do total days, weeks, months and hours mean?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Total days is the number of whole days between the date of birth and the “age as of” date. Total weeks is that figure divided by seven and rounded down. Total months is completed years × 12 plus the extra completed months. Total hours is total days × 24, so it counts whole days rather than the actual time of birth."
          }
        },
        {
          "@type": "Question",
          "name": "Does the calculator use my time of birth or time zone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. It works with calendar dates only, read in your device’s local time zone, and treats both dates as starting at midnight. If you need age to the hour, for example for a newborn, you would need to account for the time of birth separately."
          }
        },
        {
          "@type": "Question",
          "name": "Why does the calculator show an error message?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An error appears if either date is missing or invalid, or if the date of birth is later than the “age as of” date. Correct the date and the results return immediately."
          }
        },
        {
          "@type": "Question",
          "name": "Can different age calculators give slightly different answers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Month lengths vary, so tools can differ in how they count the leftover days when the birth day is later in the month than the target day. Total days lived is unambiguous, so it is the best figure to compare if two tools disagree on the months-and-days part."
          }
        },
        {
          "@type": "Question",
          "name": "How is the zodiac sign determined?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It uses the commonly published Western tropical zodiac date ranges, for example Aries from 21 March to 19 April. Published boundaries can differ by a day between sources, so treat it as a light-hearted extra."
          }
        },
        {
          "@type": "Question",
          "name": "Is my date of birth sent anywhere?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Never. All date math runs entirely in your browser with JavaScript. Nothing is uploaded, stored on a server or shared with any third party."
          }
        }
      ]
    }
    </script>
