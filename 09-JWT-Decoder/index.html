    <!-- Structured Data: FAQPage JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What are the three parts of a JWT?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A signed JSON Web Token has three dot-separated segments: the header, which describes the signing algorithm and token type; the payload, which contains the claims; and the signature, which the issuer uses to detect tampering. This tool decodes the header and payload, which are only base64url-encoded, not encrypted."
          }
        },
        {
          "@type": "Question",
          "name": "Does decoding a JWT verify that it is valid or trustworthy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Decoding only reveals the contents of the header and payload. It does not check the signature, so it cannot prove the token was issued by a trusted party or that it has not been altered. Signature verification requires the issuer secret or public key and should be done on your backend."
          }
        },
        {
          "@type": "Question",
          "name": "Is my token sent to a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. All base64url decoding and claim parsing happens locally in your browser using native JavaScript. Your token is never uploaded or stored."
          }
        },
        {
          "@type": "Question",
          "name": "Why does the payload show numbers for exp and iat?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Time-based claims such as exp (expiration), nbf (not before) and iat (issued at) are stored as Unix timestamps, the number of seconds since 1 January 1970 UTC. The decoder converts them into readable dates and times in your local time zone."
          }
        },
        {
          "@type": "Question",
          "name": "How does the tool decide whether a token is expired?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It compares the exp and nbf claims with the current time on your device. If nbf is in the future the token is shown as not yet valid, if exp has passed it is shown as expired, and if there is no exp claim it is shown as having no expiration. An incorrect device clock will give an incorrect result."
          }
        },
        {
          "@type": "Question",
          "name": "Can anyone read the data inside a JWT?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The header and payload of a signed JWT are only encoded, so anyone who has the token can decode them. Never put passwords, API keys or other secrets in a JWT payload."
          }
        },
        {
          "@type": "Question",
          "name": "Why do I get an error saying the token must have 3 parts?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A signed JWT always has exactly three segments separated by dots. The error usually means the token was cut off while copying, contains extra text, or is an encrypted JWE token, which has five parts and cannot be decoded without a key."
          }
        },
        {
          "@type": "Question",
          "name": "Should I include the word Bearer when pasting a token?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Paste only the token itself. If you copied the full Authorization header value, remove the word Bearer and the following space before pasting."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between HS256 and RS256?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "HS256 signs the token with HMAC using one shared secret that both the issuer and the verifier must know. RS256 signs with an RSA private key held by the issuer, and anyone can verify it with the matching public key. The alg value in the header shows which one a token uses."
          }
        }
      ]
    }
    </script>
