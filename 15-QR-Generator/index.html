    <!-- Structured Data: WebApplication JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "MicroFree QR Code Generator",
      "url": "https://microfree.store/qr-generator/",
      "description": "Generate customizable, scannable QR codes for text, URLs, email, phone, SMS, Wi-Fi networks, and vCard contacts with adjustable colors, size, and error correction, exportable as PNG or SVG.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All (Modern Web Browser)",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "browserRequirements": "Requires JavaScript and HTML5 Canvas support",
      "featureList": [
        "QR codes for text, URL, email, phone, SMS, Wi-Fi, and vCard contacts",
        "Custom foreground and background colors",
        "Adjustable size and error correction level (L/M/Q/H)",
        "High-resolution PNG download",
        "Scalable vector SVG download",
        "Live preview with quiet-zone margin for reliable scanning",
        "100% private in-browser generation"
      ]
    }
    </script>

    <!-- Structured Data: FAQPage JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is the error-correction level and which should I choose?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Error correction lets a QR code still scan when part of it is dirty, scratched or obscured. Level L can recover about 7% of the code, M about 15%, Q about 25% and H about 30%. Higher levels make the pattern denser, so M is a good default for screens and clean prints, while Q or H suits codes that will be printed small, used outdoors or handled a lot."
          }
        },
        {
          "@type": "Question",
          "name": "Do the Wi-Fi and contact QR codes really work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The Wi-Fi code uses the widely supported WIFI: format that the built-in camera apps on most modern iPhone and Android phones recognise, offering to join the network. The contact code uses the vCard 3.0 format, which phones offer to save to the address book. Very old devices may need a separate scanner app."
          }
        },
        {
          "@type": "Question",
          "name": "Do these QR codes expire or track scans?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. These are static QR codes: your link or text is encoded directly into the pattern, with no redirect service in between. They keep working for as long as the content they point to exists, and no scan data is collected. The flip side is that you cannot edit the destination after printing; you would need to generate a new code."
          }
        },
        {
          "@type": "Question",
          "name": "Should I download PNG or SVG?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PNG is a pixel image at the size you choose with the slider (120 to 800 pixels), ideal for websites, documents and messaging. SVG is a vector file that stays perfectly sharp at any size, so it is the better choice for printing, signage and design software."
          }
        },
        {
          "@type": "Question",
          "name": "How much data can a QR code hold?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The QR standard allows up to roughly 2,900 bytes of binary data at the lowest error-correction level, and less at higher levels. In practice, shorter content is better: a short URL produces a simpler pattern that scans faster and more reliably. If your input is too long, the tool shows an error instead of a code."
          }
        },
        {
          "@type": "Question",
          "name": "Why does my code fail to scan sometimes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The most common causes are low contrast between the foreground and background colours, a code printed too small for the scanning distance, not enough blank space around the code, glare on glossy surfaces, or a very dense pattern from long content. The tool warns you when colour contrast is too low; keeping the code dark-on-light gives the most reliable results."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use custom colours?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. You can pick any foreground and background colour. Keep the foreground clearly darker than the background, because many scanners struggle with light-on-dark (inverted) codes and with low-contrast colour combinations. A warning appears if the contrast ratio drops too low."
          }
        },
        {
          "@type": "Question",
          "name": "Is it safe to put my Wi-Fi password in a QR code?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The password is stored in the code in readable form, so anyone who scans it, or photographs it, can see and use it. That is fine for a guest network displayed at home or in a café, but avoid publicly displaying codes for private networks. The code is generated on your device and the password is never sent to us."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use the QR codes commercially?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The codes you create are yours to use on menus, packaging, flyers, business cards or websites. There is no watermark and no attribution required. Always test a printed sample with a few different phones before a large print run."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data sent anywhere?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Every QR code is rendered locally in your browser. The text, Wi-Fi password or contact details you type never leave your device and are not stored on any server."
          }
        }
      ]
    }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
