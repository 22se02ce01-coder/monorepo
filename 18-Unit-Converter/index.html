    <!-- Structured Data: WebApplication JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "MicroFree Unit Converter",
      "url": "https://unitconverter.microfree.store/",
      "description": "Convert values across length, weight, temperature, area, volume, speed, time, data storage, energy and pressure with accurate factors and exact temperature formulas.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All (Modern Web Browser)",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "browserRequirements": "Requires JavaScript",
      "featureList": [
        "Length, weight and temperature conversion",
        "Area, volume, speed and time conversion",
        "Data storage units (decimal KB and binary KiB)",
        "Energy and pressure conversion",
        "Live conversion to every unit in a category",
        "Accurate factors and exact temperature formulas",
        "100% private in-browser calculation"
      ]
    }
    </script>
    <!-- Structured Data: FAQPage JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How accurate are the conversions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The converter uses internationally defined factors, many of which are exact, such as 1 inch = 0.0254 meters and 1 pound = 0.45359237 kilograms. Results are displayed with up to twelve significant digits, which is far more precision than everyday measurements need."
          }
        },
        {
          "@type": "Question",
          "name": "How does temperature conversion work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Temperature scales have different zero points, so the tool uses formulas instead of factors. It converts your value to Celsius first and then to the target scale, for example °F = °C × 9/5 + 32 and K = °C + 273.15. Celsius, Fahrenheit, Kelvin and Rankine are supported."
          }
        },
        {
          "@type": "Question",
          "name": "Why does converting 10 °C give 50 °F instead of 18 °F?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The converter converts temperature readings, not temperature differences. A reading of 10 °C equals 50 °F, but a change of 10 °C equals a change of 18 °F. To convert a difference, multiply by 9/5 instead."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between KB and KiB?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Decimal units use powers of 1000 (1 KB = 1,000 bytes, 1 GB = 1,000,000,000 bytes), which is how storage manufacturers label capacity. Binary units use powers of 1024 (1 KiB = 1,024 bytes, 1 GiB = 1,073,741,824 bytes), which many operating systems use. That is why a 500 GB drive is shown as about 465.66 GiB."
          }
        },
        {
          "@type": "Question",
          "name": "Are the cups, pints and gallons US or UK measures?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cups, pints, quarts, fluid ounces, tablespoons and teaspoons are US customary measures. Gallons are offered in both versions: a US gallon is 3.785411784 liters and a UK gallon is 4.54609 liters."
          }
        },
        {
          "@type": "Question",
          "name": "Is the calorie the same as the Calorie on food labels?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The calorie in this tool is the small calorie, exactly 4.184 joules. Food labels use the kilocalorie (kcal), equal to 1,000 small calories or 4,184 joules, which the tool also lists."
          }
        },
        {
          "@type": "Question",
          "name": "How are months and years handled in time conversions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For simplicity a month is treated as exactly 30 days and a year as exactly 365 days. Real calendar months and leap years vary, so use a date calculator when you need exact calendar arithmetic."
          }
        },
        {
          "@type": "Question",
          "name": "Why do some results use scientific notation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Values smaller than 0.000001 or of 10^15 and above are shown in scientific notation, such as 8.000000e+15 bits in a petabyte, so that significant digits are not lost or hidden. Everyday values are shown as plain decimals with trailing zeros removed."
          }
        },
        {
          "@type": "Question",
          "name": "Can I see a value in every unit at once?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The reference table under the result lists your value converted into every unit of the selected category, and the target unit is highlighted. The copy button copies the full equation for the selected pair."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data sent to a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Every calculation runs locally in your browser using a fixed table of conversion factors. Nothing you enter is uploaded, logged or stored."
          }
        }
      ]
    }
    </script>
