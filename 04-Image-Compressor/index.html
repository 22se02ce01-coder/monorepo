    <!-- Structured Data: WebApplication JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "MicroFree Image Compressor",
      "url": "https://microfree.store/image-compressor/",
      "description": "Compress JPG, PNG, and WebP images directly in your browser with before/after size comparison, a custom quality slider, target size in KB, and per-image download.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "All (Modern Web Browser)",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "browserRequirements": "Requires JavaScript and HTML5 Canvas support",
      "featureList": [
        "Batch compression for multiple images",
        "Custom quality slider from 10% to 95%",
        "Target file size (KB) auto-calibration",
        "Before and after visual comparison",
        "Original vs compressed size with percentage reduction",
        "Individual and batch downloads",
        "100% client-side privacy without server uploads"
      ]
    }
    </script>
    <!-- Structured Data: FAQPage JSON-LD (mirrors FAQ in src/components/SEO.tsx) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Are my images uploaded to a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The images are decoded, re-encoded, and previewed entirely inside your browser using the HTML5 Canvas API. The files are never sent to MicroFree or any other server."
          }
        },
        {
          "@type": "Question",
          "name": "Which image formats can I compress?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can upload JPG/JPEG, PNG, and WebP files. The output can stay in the original format or be converted to WebP, JPEG, or PNG using the Output Format menu."
          }
        },
        {
          "@type": "Question",
          "name": "What does the quality slider actually change?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The slider (10% to 95%) sets the encoder quality used when the image is saved as JPEG or WebP. Lower values discard more fine detail and produce smaller files. It has no effect on PNG output, because PNG is a lossless format."
          }
        },
        {
          "@type": "Question",
          "name": "How does the Target Size (KB) option work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "When you enter a target size and the output format is JPEG or WebP, the tool tries several quality levels in a short binary search and keeps the highest quality it found that fits under your limit, overriding the slider. If no tested quality fits, the image is saved at your slider quality instead, so always check the final size. The target size is ignored for PNG output."
          }
        },
        {
          "@type": "Question",
          "name": "Why is my compressed PNG not much smaller, or even the same size?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PNG is lossless, so re-saving it in the browser cannot throw away detail the way JPEG or WebP can. If an already optimized PNG is re-encoded, the result may be about the same size or occasionally larger. For big savings on photos or screenshots, convert to WebP or JPEG instead."
          }
        },
        {
          "@type": "Question",
          "name": "What happens to transparent backgrounds?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Transparency is kept when the output is PNG or WebP. JPEG does not support transparency, so when an image is converted to JPEG the transparent areas are filled with white."
          }
        },
        {
          "@type": "Question",
          "name": "Does the tool resize my images or keep EXIF data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The pixel dimensions stay exactly the same; the tool does not resize or crop. Because each image is redrawn on a canvas and re-encoded, metadata such as EXIF camera details and GPS location is not copied into the compressed file."
          }
        },
        {
          "@type": "Question",
          "name": "Why does my converted file still have the old extension?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Downloaded files are named compressed_ followed by the original file name, so a PNG converted to WebP keeps the .png extension in its name. The file content is in the new format; rename the extension to .webp or .jpg if another program relies on it."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a limit on file size or number of images?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "There is no fixed limit set by the tool. Images are processed one after another in your browser, so the practical limit depends on your device memory. Very large photos or long batches may be slow on phones and older computers."
          }
        },
        {
          "@type": "Question",
          "name": "Is the image compressor free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The tool is free to use, does not require an account, and does not add watermarks to your images."
          }
        }
      ]
    }
    </script>
